name: Update Currency Rates

on:
  schedule:
    # Run every hour (24 times/day = ~720 req/month, 14.4% of 5000 free limit)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest currency rates
        env:
          CURRENCYBEACON_API_KEY: ${{ secrets.CURRENCYBEACON_API_KEY }}
        run: node scripts/update-currency-rates.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/currency-rates.json data/currency-version.json
          git diff --staged --quiet || git commit -m "Update currency rates $(date +'%Y-%m-%d %H:%M UTC')"
          git push
